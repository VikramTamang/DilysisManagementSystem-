<div class="min-h-screen bg-bg-clinical text-text-clinical flex flex-col items-center justify-center font-sans px-4 py-6 relative overflow-hidden selection:bg-accent/30 selection:text-primary">
  <!-- Decorative Glowing Orbs -->
  <div class="absolute top-[10%] left-[20%] w-[450px] h-[450px] bg-blue-500/10 rounded-full blur-[100px] -z-10 animate-blob"></div>
  <div class="absolute bottom-[10%] right-[20%] w-[450px] h-[450px] bg-indigo-500/10 rounded-full blur-[100px] -z-10 animate-blob animate-delay-2000"></div>

  <!-- Header Logo -->
  <div class="mb-5 flex flex-col items-center">
    <a routerLink="/" class="flex items-center gap-2.5 group">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/25 group-hover:scale-105 transition-transform duration-300">
        <span class="font-poppins font-black text-white text-base">D</span>
      </div>
      <span class="text-xl font-black tracking-tight text-white font-poppins">
        DiaCare
      </span>
    </a>
  </div>

  <!-- Glassmorphic Login Card -->
  <div class="w-full max-w-sm glass-login-card rounded-2xl p-6 backdrop-blur-3xl relative border border-white/10 shadow-2xl">
    <div class="text-center space-y-1 mb-5">
      <h2 class="text-xl font-extrabold text-white tracking-tight font-poppins">Welcome back</h2>
      <p class="text-[11px] text-gray-400 font-medium">Please enter your credentials to access your portal</p>
    </div>

    <!-- Role Selection Segmented Control -->
    <div class="mb-5">
      <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-wider mb-2">
        Select Portal Role
      </label>
      <div class="grid grid-cols-3 gap-1 bg-black/40 p-1 rounded-xl border border-white/5 backdrop-blur-md relative">
        <button
          type="button"
          (click)="selectRole('patient')"
          [class.active-tab]="selectedRole === 'patient'"
          class="role-btn py-1.5 text-xs font-bold rounded-lg transition-all duration-300 text-gray-400 hover:text-white z-10"
        >
          Patient
        </button>
        <button
          type="button"
          (click)="selectRole('staff')"
          [class.active-tab]="selectedRole === 'staff'"
          class="role-btn py-1.5 text-xs font-bold rounded-lg transition-all duration-300 text-gray-400 hover:text-white z-10"
        >
          Staff
        </button>
        <button
          type="button"
          (click)="selectRole('admin')"
          [class.active-tab]="selectedRole === 'admin'"
          class="role-btn py-1.5 text-xs font-bold rounded-lg transition-all duration-300 text-gray-400 hover:text-white z-10"
        >
          Admin
        </button>
      </div>
    </div>

    <!-- Error message banner -->
    @if (errorMessage) {
      <div class="mb-4 p-3 rounded-lg border border-rose-950 bg-rose-950/20 backdrop-blur-md text-rose-400 text-xs flex items-center gap-2 animate-shake">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="font-medium">{{ errorMessage }}</span>
      </div>
    }

    <!-- Form -->
    <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-4">
      <!-- Email Input -->
      <div class="space-y-1.5">
        <label for="email" class="block text-[9px] font-bold text-gray-400 uppercase tracking-wider">
          Email Address
        </label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
            </svg>
          </span>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="name@hospital.com"
            required
            class="w-full pl-10 pr-4 py-3 bg-white/5 hover:bg-white/8 border border-white/10 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 shadow-sm"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between">
          <label for="password" class="block text-[9px] font-bold text-gray-400 uppercase tracking-wider">
            Password
          </label>
          <a href="#" class="text-[11px] text-blue-400 hover:text-blue-300 font-bold transition-colors">Forgot password?</a>
        </div>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required
            class="w-full pl-10 pr-10 py-3 bg-white/5 hover:bg-white/8 border border-white/10 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-300 shadow-sm"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 transition-colors"
          >
            @if (showPassword) {
              <!-- Eye Off Icon -->
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            } @else {
              <!-- Eye Icon -->
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="w-full py-3 rounded-xl font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-xl shadow-blue-500/10 hover:shadow-blue-500/20 transform hover:-translate-y-0.5 transition-all duration-300"
      >
        Sign In as {{ selectedRole | titlecase }}
      </button>
    </form>

    @if (selectedRole === 'patient') {
      <p class="text-center text-[11px] text-gray-400 mt-4">
        New patient?
        <a routerLink="/register" class="text-blue-400 hover:text-blue-300 font-bold transition-colors">Create an account</a>
      </p>
    } @else {
      <p class="text-center text-[11px] text-gray-500 mt-4">
        Staff and admin accounts are created by an administrator.
      </p>
    }
  </div>

  <!-- Back to Home link -->
  <a routerLink="/" class="mt-5 text-xs text-gray-500 hover:text-blue-400 font-semibold flex items-center gap-1.5 group transition-colors">
    <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Home
  </a>
</div>
