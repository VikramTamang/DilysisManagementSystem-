server:
  port: 8080

spring:
  application:
    name: fonepay-gateway

  datasource:
    url: jdbc:mysql://localhost:3306/fonepay_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: Password@143
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Hibernate creates/updates tables automatically based on our entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.fonepay.gateway: DEBUG