server:
  port: 8080

jwt:
  secret: dGhpc2lzYXZlcnlzZWN1cmVrZXlmb3Jqd3RzaWduaW5nYnljcnlwdG9ncmFwaHk= # 256-bit key
  access-token-expiration: 900000 # 15 min
  refresh-token-expiration: 604800000 # 7 days

spring:
  application:
    name: fonepay-gateway

  datasource:
    url: jdbc:mysql://localhost:3306/fonepay_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: root
    password: Password@143
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.fonepay.gateway: DEBUG